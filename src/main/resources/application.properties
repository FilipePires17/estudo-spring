spring.application.name=estudo-spring

# ===============================
# CONEXÃO COM O POSTGRESQL
# ===============================
# Formato: jdbc:postgresql://<host>:<porta>/<nome_do_banco>
spring.datasource.url=jdbc:postgresql://localhost:5432/estudospring
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===============================
# update: cria ou atualiza as tabelas no Postgres automaticamente baseado nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL executadas no terminal e formata para ficar legível
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true